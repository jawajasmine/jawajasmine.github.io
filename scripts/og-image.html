<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&display=block" rel="stylesheet">
<style>
  /* Mirrors src/index.scss tokens */
  :root {
    --bg: #0a0a10;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --subtle: #8090a6;
    --primary: #a78bfa;
    --secondary: #38bdf8;
    --border: rgba(255,255,255,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(167,139,250,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(167,139,250,0.05) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at 30% 40%, black 20%, transparent 75%);
  }
  .orb { position: absolute; border-radius: 50%; }
  .orb--1 { width: 700px; height: 700px; top: -260px; right: -200px;
    background: radial-gradient(circle, rgba(124,58,237,0.35) 0%, transparent 70%); }
  .orb--2 { width: 460px; height: 460px; bottom: -220px; left: -140px;
    background: radial-gradient(circle, rgba(56,189,248,0.18) 0%, transparent 70%); }
  .wrap {
    position: relative; height: 100%;
    padding: 72px 80px 64px;
    display: flex; flex-direction: column;
  }
  .eyebrow {
    display: flex; align-items: center; gap: 12px;
    font-size: 24px; font-weight: 500; color: var(--muted);
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 14px #22c55e; }
  h1 {
    margin-top: 28px;
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 80px; font-weight: 900; line-height: 1.04; letter-spacing: -0.02em;
    max-width: 15ch;
  }
  .grad {
    background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .foot {
    margin-top: auto;
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .stats { display: flex; }
  .stat { padding: 0 32px; border-left: 1px solid var(--border); }
  .stat:first-child { padding-left: 0; border-left: 0; }
  .num { font-family: 'Playfair Display', Georgia, serif; font-size: 44px; font-weight: 900; line-height: 1; }
  .num span { color: var(--primary); font-size: 32px; }
  .label { margin-top: 8px; font-size: 15px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--subtle); }
  .url { font-size: 20px; font-weight: 500; color: var(--muted); }
</style>
</head>
<body>
  <div class="orb orb--1"></div>
  <div class="orb orb--2"></div>
  <div class="grid"></div>
  <div class="wrap">
    <p class="eyebrow"><span class="dot"></span>Jasmeen Jawa · UX Design Leader</p>
    <h1>I design enterprise products people <span class="grad">actually adopt.</span></h1>
    <div class="foot">
      <div class="stats">
        <div class="stat"><div class="num">17<span>+</span></div><div class="label">Years in UX</div></div>
        <div class="stat"><div class="num">50<span>%</span></div><div class="label">Adoption lift, Samsung SDS</div></div>
        <div class="stat"><div class="num">2</div><div class="label">Design systems built</div></div>
      </div>
      <div class="url">jawajasmine.github.io</div>
    </div>
  </div>
</body>
</html>
